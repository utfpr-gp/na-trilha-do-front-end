<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilhas · Trilheiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <nav class="navbar navbar-expand-md py-3" data-bs-theme="dark" aria-label="Principal">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-compass" aria-hidden="true"></i> Trilheiro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir o menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="trilhas.html">Trilhas</a></li>
            <li class="nav-item"><a class="nav-link" href="cadastrar.html">Cadastrar trilha</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container flex-grow-1 py-5" id="conteudo" tabindex="-1">
    <h1 class="mb-3">Todas as trilhas</h1>

    <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
      <div class="btn-group flex-wrap" role="group" aria-label="Filtrar por dificuldade" id="trail-filter">
        <input type="radio" class="btn-check" name="filtro" id="filtro-todas" value="todas" checked>
        <label class="btn btn-outline-primary" for="filtro-todas">Todas</label>
        <input type="radio" class="btn-check" name="filtro" id="filtro-facil" value="facil">
        <label class="btn btn-outline-primary" for="filtro-facil">Fácil</label>
        <input type="radio" class="btn-check" name="filtro" id="filtro-moderada" value="moderada">
        <label class="btn btn-outline-primary" for="filtro-moderada">Moderada</label>
        <input type="radio" class="btn-check" name="filtro" id="filtro-dificil" value="dificil">
        <label class="btn btn-outline-primary" for="filtro-dificil">Difícil</label>
        <input type="radio" class="btn-check" name="filtro" id="filtro-favoritas" value="favoritas">
        <label class="btn btn-outline-primary" for="filtro-favoritas"><i class="bi bi-heart-fill" aria-hidden="true"></i> Favoritas</label>
      </div>
      <p class="mb-0 text-body-secondary" id="trail-status" aria-live="polite"></p>
    </div>

    <section aria-labelledby="lista">
      <h2 id="lista" class="visually-hidden">Lista de trilhas</h2>
      <div class="row g-4" id="trail-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__marca">
      <strong>Trilheiro</strong>
      <span>Trilhas da região de Guarapuava</span>
    </div>
    <div class="site-footer__fontes">
      <span>Previsão do tempo: <a href="https://open-meteo.com">Open-Meteo</a></span>
      <span>Endereços: <a href="https://viacep.com.br">ViaCEP</a></span>
    </div>
    <p class="site-footer__aviso">As trilhas são exemplos inspirados em lugares reais. O Trilheiro não é um guia de segurança.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/trails.js"></script>
</body>
</html>
