<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilheiro</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Trilheiro</h1>
    <p>Trilhas da região de Guarapuava</p>
  </header>

  <main class="site-main">
    <section aria-labelledby="destaques">
      <h2 id="destaques">Trilhas em destaque</h2>

      <article class="card" style="max-width: 22rem;">
        <img src="salto.svg" class="card-img-top" alt="Queda-d'água entre morros">
        <div class="card-body">
          <span class="badge text-bg-warning">Moderada</span>
          <h3 class="card-title h5 my-2">Trilha do Salto</h3>
          <p class="card-text">Prudentópolis, PR · 4,5 km · 2h30</p>
          <a href="#" class="btn btn-primary">Ver trilha</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>As trilhas são exemplos inspirados em lugares reais. O Trilheiro não é um guia de segurança.</p>
  </footer>
</body>
</html>
