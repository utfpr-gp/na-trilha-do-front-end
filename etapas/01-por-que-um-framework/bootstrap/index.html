<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilheiro · cartão com Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="py-5 px-3">
    <article class="card" style="max-width: 22rem;">
      <img src="salto.svg" class="card-img-top" alt="Queda-d'água entre morros">
      <div class="card-body">
        <span class="badge text-bg-warning">Moderada</span>
        <h2 class="card-title h5 my-2">Trilha do Salto</h2>
        <p class="card-text">Prudentópolis, PR · 4,5 km · 2h30</p>
        <a href="#" class="btn btn-primary">Ver trilha</a>
      </div>
    </article>
  </main>
</body>
</html>
