<div class="modal fade" id="novo-relato" tabindex="-1" aria-labelledby="novo-relato-titulo" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="novo-relato-titulo">Conte como foi</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <form id="form-relato">
          <div class="mb-3">
            <label for="relato-nome" class="form-label">Seu nome</label>
            <input type="text" class="form-control" id="relato-nome">
          </div>
          <div class="mb-3">
            <label for="relato-texto" class="form-label">Como foi?</label>
            <textarea class="form-control" id="relato-texto" rows="4"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" form="form-relato">Publicar relato</button>
      </div>
    </div>
  </div>
</div>
