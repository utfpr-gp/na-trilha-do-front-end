<div id="fotos" class="carousel slide mb-4">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#fotos" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Foto 1"></button>
    <button type="button" data-bs-target="#fotos" data-bs-slide-to="1" aria-label="Foto 2"></button>
    <button type="button" data-bs-target="#fotos" data-bs-slide-to="2" aria-label="Foto 3"></button>
  </div>
  <div class="carousel-inner rounded">
    <div class="carousel-item active">
      <img src="salto.svg" class="d-block w-100" alt="Queda-d'água vista de baixo, entre morros">
    </div>
    <div class="carousel-item">
      <img src="salto-degraus.svg" class="d-block w-100" alt="Degraus de pedra descendo pela mata">
    </div>
    <div class="carousel-item">
      <img src="araucarias.svg" class="d-block w-100" alt="Araucárias no começo da trilha">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#fotos" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Foto anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#fotos" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Próxima foto</span>
  </button>
</div>
