<dialog id="dicas" class="modal" aria-labelledby="dicas-titulo">
  <div class="modal-header">
    <h2 id="dicas-titulo">Dicas de segurança</h2>
  </div>
  <div class="modal-content">
    <ul class="browser-default">
      <li>Avise alguém aonde você vai e a que horas pretende voltar.</li>
      <li>Leve água, lanche e uma capa de chuva.</li>
      <li>Confira a previsão do tempo antes de sair.</li>
    </ul>
  </div>
  <form method="dialog" class="modal-footer">
    <button class="btn-flat">Fechar</button> <!-- num form method="dialog", o botão fecha o dialog -->
  </form>
</dialog>
